$("mailForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const d={name:$("mName").value.trim(),email:$("mFrom").value.trim(),subject:$("mSubject").value.trim(),message:$("mMessage").value.trim(),website:$("website").value};
 if(!d.name||!d.subject||!d.message||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)){status.className="err";status.textContent=t("bad");return}
 if(!API_URL){location.href=`mailto:${EMAIL}?subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.message+"\n\n— "+d.name+" ("+d.email+")")}`;status.className="muted";status.textContent=t("mailapp");return}
 const btn=$("sendBtn");btn.disabled=true;btn.textContent=t("sending");status.className="muted";status.textContent="";
 try{
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.ok){status.className="ok";status.textContent=t("ok");$("mailForm").reset()}

 }catch(err){status.className="err";status.textContent=t("net")+EMAIL}
