<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expense Tracker — Ahmed Sghaier</title><meta name="theme-color" content="#0f1020">
<meta name="description" content="Track income and expenses with categories, budget and charts. Data stays in your browser.">
<style>
:root{--bg:#0f1020;--card:#181a33;--line:#2a2d52;--tx:#eef0ff;--mu:#9aa0c8;--ac:#8b7bff;--in:#3fe0a5;--out:#ff6b8b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#2a1f6b66,transparent),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:-.4px}h1 span{color:var(--ac)}
a.back{color:var(--mu);text-decoration:none;font-size:13px}a.back:hover{color:var(--tx)}
.bar{display:flex;gap:8px;flex-wrap:wrap}
select,input,button{font:inherit;color:var(--tx)}
select,input{background:#10122a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;min-width:0}select:focus,input:focus{border-color:var(--ac)}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--ac);font-weight:650}button.ghost{background:transparent;border:1px solid var(--line);color:var(--mu)}
.hero{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.card{background:linear-gradient(160deg,#1c1f3d,var(--card));border:1px solid var(--line);border-radius:16px;padding:18px}
.k{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.8px}.big{font-size:clamp(28px,5vw,40px);font-weight:750;letter-spacing:-1px;margin-top:4px}
.in{color:var(--in)}.out{color:var(--out)}.v{font-size:22px;font-weight:700;margin-top:4px}
.budget{margin-top:12px}.track{height:8px;background:#10122a;border-radius:8px;overflow:hidden;margin-top:6px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--in));border-radius:8px;transition:width .6s}.fill.over{background:var(--out)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
h2{font-size:14px;margin:0 0 12px;color:var(--mu);font-weight:600}
form.add{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}form.add>*{grid-column:span 2}form.add .w3{grid-column:span 3}form.add .w6{grid-column:span 6}
form.add .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;grid-column:span 6}.seg button{flex:1;border-radius:0;background:transparent;color:var(--mu)}.seg button.on{background:var(--ac);color:var(--tx)}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.legend{flex:1;min-width:150px;font-size:13px}.legend div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:7px}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px}.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}.pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}.pair i{display:block;width:40%;max-width:18px;border-radius:5px 5px 0 0;min-height:2px}.col small{color:var(--mu);font-size:11px}
.list{margin-top:12px}.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.ic{width:38px;height:38px;border-radius:11px;background:#10122a;display:grid;place-items:center;font-size:18px;flex:0 0 38px}.tx .m{flex:1;min-width:0}.tx .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx .m small{color:var(--mu)}.tx button{padding:6px 9px;background:transparent;color:var(--mu);border:1px solid var(--line)}.tx button:hover{color:var(--out);border-color:var(--out)}
.empty{color:var(--mu);text-align:center;padding:26px 0}
@media(max-width:820px){.hero,.row{grid-template-columns:1fr}form.add>*,form.add .w3{grid-column:span 6}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style></head><body><div class="wrap">
<header><div><a class="back" href="index.html">← ahmed.dev</a><h1>Expense<span>Tracker</span></h1></div>
<div class="bar"><select id="month" aria-label="Month"></select><select id="cur" aria-label="Currency"><option>TND</option><option>EUR</option><option>USD</option></select><button class="ghost" id="csv">Export CSV</button></div></header>
<section class="hero"><div class="card"><div class="k">Balance</div><div class="big" id="bal">0</div>
<div class="budget"><div class="k" style="display:flex;justify-content:space-between;align-items:center"><span>Monthly budget</span><input id="bud" type="number" min="0" step="1" placeholder="0" style="width:110px;padding:6px 9px" aria-label="Monthly budget"></div><div class="track"><div class="fill" id="bf"></div></div><div class="k" id="bt" style="margin-top:6px;text-transform:none;letter-spacing:0"></div></div></div>
<div class="card"><div class="k">Income</div><div class="v in" id="inc">0</div></div><div class="card"><div class="k">Expenses</div><div class="v out" id="exp">0</div></div></section>
<section class="row"><div class="card"><h2>Add transaction</h2><form class="add" id="f"><div class="seg" role="group" aria-label="Type"><button type="button" data-t="out" class="on">Expense</button><button type="button" data-t="in">Income</button></div>
<input class="w3" id="amt" type="number" min="0.001" step="0.001" placeholder="Amount" required aria-label="Amount"><select class="w3" id="cat" aria-label="Category"></select>
<input class="w3" id="dt" type="date" required aria-label="Date"><input class="w3" id="note" maxlength="60" placeholder="Note (optional)" aria-label="Note"><button class="w6" type="submit">Add</button></form></div>
<div class="card"><h2>Spending by category</h2><div class="donut"><svg id="dn" width="150" height="150" viewBox="0 0 42 42" role="img" aria-label="Spending by category"></svg><div class="legend" id="lg"></div></div></div></section>
<section class="row"><div class="card"><h2>Last 6 months</h2><div class="bars" id="br"></div></div>
<div class="card"><h2>Transactions</h2><input id="q" placeholder="Search…" style="width:100%" aria-label="Search"><div class="list" id="ls"></div></div></section>
</div>
<script>
const CATS={out:[["🍔","Food"],["🚌","Transport"],["🏠","Home"],["🛍️","Shopping"],["🎮","Fun"],["💊","Health"],["📚","Study"],["📦","Other"]],in:[["💼","Salary"],["🧾","Freelance"],["🎁","Gift"],["➕","Other"]]};
const COL=["#8b7bff","#3fe0a5","#ff6b8b","#ffc857","#4cc9f0","#f78fb3","#b8f35c","#9aa0c8"];
const $=id=>document.getElementById(id);let type="out",tx=[],st={cur:"TND",bud:0};
const load=()=>{try{tx=JSON.parse(localStorage.getItem("ex_tx")||"[]");st={...st,...JSON.parse(localStorage.getItem("ex_st")||"{}")}}catch(e){}};
const save=()=>{try{localStorage.setItem("ex_tx",JSON.stringify(tx));localStorage.setItem("ex_st",JSON.stringify(st))}catch(e){}};
const fmt=n=>new Intl.NumberFormat("en",{style:"currency",currency:st.cur,minimumFractionDigits:st.cur==="TND"?3:2,maximumFractionDigits:st.cur==="TND"?3:2}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mk=d=>d.slice(0,7),today=()=>new Date().toISOString().slice(0,10);
function months(){const s=new Set([mk(today()),...tx.map(t=>mk(t.date))]);return [...s].sort().reverse()}
function fillMonths(keep){const sel=$("month");sel.innerHTML=months().map(m=>`<option value="${m}">${new Date(m+"-01").toLocaleString("en",{month:"long",year:"numeric"})}</option>`).join("");if(keep)sel.value=keep}
function fillCats(){$("cat").innerHTML=CATS[type].map(c=>`<option value="${c[1]}">${c[0]} ${c[1]}</option>`).join("")}
const icon=(t,c)=>(CATS[t].find(x=>x[1]===c)||["•"])[0];
function render(){
 const m=$("month").value,cur=tx.filter(t=>mk(t.date)===m);
 const inc=cur.filter(t=>t.type==="in").reduce((s,t)=>s+t.amt,0),exp=cur.filter(t=>t.type==="out").reduce((s,t)=>s+t.amt,0);
 $("inc").textContent=fmt(inc);$("exp").textContent=fmt(exp);$("bal").textContent=fmt(inc-exp);$("bal").className="big "+(inc-exp<0?"out":"");
 const b=+st.bud||0,p=b?Math.min(100,exp/b*100):0;$("bf").style.width=p+"%";$("bf").className="fill"+(b&&exp>b?" over":"");
 $("bt").textContent=b?(exp>b?"Over budget by "+fmt(exp-b):fmt(b-exp)+" left"):"Set a budget to track it";
 const by={};cur.filter(t=>t.type==="out").forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
 const ents=Object.entries(by).sort((a,b)=>b[1]-a[1]);let off=0;
 $("dn").innerHTML=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="#10122a" stroke-width="6"/>`+ents.map(([k,v],i)=>{const d=v/exp*100,s=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${COL[i%8]}" stroke-width="6" stroke-dasharray="${d} ${100-d}" stroke-dashoffset="${25-off}" pathLength="100"/>`;off+=d;return s}).join("");
 $("lg").innerHTML=ents.length?ents.map(([k,v],i)=>`<div><span><span class="dot" style="background:${COL[i%8]}"></span>${esc(k)}</span><b>${Math.round(v/exp*100)}%</b></div>`).join(""):'<span class="empty" style="padding:0">No expenses yet</span>';
 const ms=[];let d=new Date(m+"-01");for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"))}
 const sums=ms.map(k=>[tx.filter(t=>mk(t.date)===k&&t.type==="in").reduce((s,t)=>s+t.amt,0),tx.filter(t=>mk(t.date)===k&&t.type==="out").reduce((s,t)=>s+t.amt,0)]);const mx=Math.max(1,...sums.flat());
 $("br").innerHTML=ms.map((k,i)=>`<div class="col"><div class="pair"><i style="height:${sums[i][0]/mx*100}%;background:var(--in)" title="Income"></i><i style="height:${sums[i][1]/mx*100}%;background:var(--out)" title="Expenses"></i></div><small>${new Date(k+"-01").toLocaleString("en",{month:"short"})}</small></div>`).join("");
 const q=$("q").value.trim().toLowerCase(),list=cur.filter(t=>!q||(t.cat+" "+t.note).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 $("ls").innerHTML=list.length?list.map(t=>`<div class="tx"><div class="ic">${icon(t.type,t.cat)}</div><div class="m"><b>${esc(t.note||t.cat)}</b><small>${esc(t.cat)} · ${t.date}</small></div><b class="${t.type}">${t.type==="in"?"+":"−"}${fmt(t.amt)}</b><button data-del="${t.id}" aria-label="Delete">✕</button></div>`).join(""):'<div class="empty">Nothing here yet — add your first transaction.</div>';
}
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{type=b.dataset.t;document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));fillCats()});
$("f").onsubmit=e=>{e.preventDefault();const a=+$("amt").value;if(!(a>0))return;tx.push({id:Date.now(),type,amt:a,cat:$("cat").value,date:$("dt").value,note:$("note").value.trim()});save();fillMonths(mk($("dt").value));$("amt").value="";$("note").value="";render()};
$("ls").onclick=e=>{const b=e.target.closest("[data-del]");if(!b)return;tx=tx.filter(t=>t.id!==+b.dataset.del);save();const m=$("month").value;fillMonths(m);render()};
$("month").onchange=render;$("q").oninput=render;
$("cur").onchange=()=>{st.cur=$("cur").value;save();render()};$("bud").oninput=()=>{st.bud=+$("bud").value||0;save();render()};
$("csv").onclick=()=>{const r=[["date","type","category","note","amount"],...tx.map(t=>[t.date,t.type,t.cat,t.note,t.amt])].map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r],{type:"text/csv"}));a.download="expenses.csv";a.click()};
load();$("cur").value=st.cur;$("bud").value=st.bud||"";$("dt").value=today();fillCats();fillMonths();render();
</script></body></html>
