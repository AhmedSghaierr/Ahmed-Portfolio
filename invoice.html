<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice Maker — Ahmed Sghaier</title><meta name="theme-color" content="#0e7c66">
<meta name="description" content="Create professional invoices with live preview, tax, discount and one-click PDF. Everything stays in your browser.">
<style>
:root{--ac:#0e7c66;--ac2:#0a5c4c;--bg:#eef2f1;--tx:#17211e;--mu:#62736e;--line:#d8e0de}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.top{background:linear-gradient(120deg,var(--ac2),var(--ac));color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:18px}.top a{color:#d6f3ec;text-decoration:none;font-size:13px}
.app{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:18px;padding:18px;max-width:1300px;margin:0 auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;align-self:start}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);margin:16px 0 8px}.panel h2:first-child{margin-top:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu);margin-bottom:9px}
input,textarea,select{font:inherit;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;outline:none;background:#fff}input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px #0e7c6620}
textarea{min-height:64px;resize:vertical}.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.item{display:grid;grid-template-columns:1fr 62px 86px 28px;gap:6px;margin-bottom:6px}.item button{padding:0}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--ac);color:#fff;font-weight:650}button:hover{background:var(--ac2)}button.ghost{background:#fff;color:var(--ac);border:1px solid var(--ac)}button.x{background:#fff;color:#b3261e;border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 40px #0a2f2820;padding:clamp(20px,5vw,48px);min-height:560px}
.sh{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.logo{max-height:56px;max-width:160px;display:block;margin-bottom:8px}
.sheet h3{margin:0;font-size:30px;letter-spacing:2px;color:var(--ac)}.sheet .meta{text-align:right;color:var(--mu);font-size:13px}.sheet .meta b{color:var(--tx)}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:26px 0}.parties small{display:block;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;font-size:11px;margin-bottom:3px}.pre{white-space:pre-line}
table{width:100%;border-collapse:collapse}th{background:var(--ac);color:#fff;text-align:left;padding:9px 10px;font-size:12px}th:not(:first-child),td:not(:first-child){text-align:right}td{padding:10px;border-bottom:1px solid var(--line)}
.tot{margin:16px 0 0 auto;width:min(280px,100%)}.tot div{display:flex;justify-content:space-between;padding:4px 0}.tot .gt{border-top:2px solid var(--ac);margin-top:6px;padding-top:9px;font-size:18px;font-weight:750;color:var(--ac)}
.notes{margin-top:30px;color:var(--mu);font-size:13px}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:12px}}
@media print{body{background:#fff}.top,.panel{display:none}.app{display:block;padding:0;max-width:none}.sheet{border:0;box-shadow:0 0 0;padding:0;min-height:0}@page{margin:16mm}th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="top"><h1>Invoice Maker</h1><a href="index.html">← ahmed.dev</a></div>
<div class="app">
<div class="panel">
<h2>Your business</h2><label>Name<input id="from" value="Ahmed Sghaier"></label><label>Details (address, phone, email)<textarea id="fromD">Sousse, Tunisia</textarea></label>
<label>Logo (optional)<input id="logo" type="file" accept="image/*"></label>
<h2>Bill to</h2><label>Client name<input id="to" placeholder="Client name"></label><label>Client details<textarea id="toD" placeholder="Address, email"></textarea></label>
<h2>Invoice</h2><div class="g2"><label>Number<input id="no"></label><label>Currency<select id="cur"><option>TND</option><option>EUR</option><option>USD</option></select></label><label>Issue date<input id="d1" type="date"></label><label>Due date<input id="d2" type="date"></label></div>
<h2>Items</h2><div id="items"></div><button class="ghost" id="add" type="button">+ Add item</button>
<div class="g2" style="margin-top:12px"><label>Tax %<input id="tax" type="number" min="0" max="100" step="0.1" value="19"></label><label>Discount %<input id="disc" type="number" min="0" max="100" step="0.1" value="0"></label></div>
<label>Notes / payment terms<textarea id="notes">Thank you for your business. Payment due by the date above.</textarea></label>
<div class="btns"><button id="print" type="button">Print / Save as PDF</button><button class="x" id="reset" type="button">Reset</button></div>
</div>
<div class="sheet" id="sheet" aria-live="polite"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="inv_v1";let logo="";
const today=()=>new Date().toISOString().slice(0,10),plus=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const fmt=n=>new Intl.NumberFormat("en",{style:"currency",currency:$("cur").value,minimumFractionDigits:$("cur").value==="TND"?3:2,maximumFractionDigits:$("cur").value==="TND"?3:2}).format(n);
function addItem(d="",q=1,p=0){const r=document.createElement("div");r.className="item";r.innerHTML=`<input placeholder="Description" aria-label="Description" value="${esc(d)}"><input type="number" min="0" step="1" aria-label="Quantity" value="${q}"><input type="number" min="0" step="0.001" aria-label="Unit price" value="${p}"><button class="x" type="button" aria-label="Remove">✕</button>`;$("items").appendChild(r)}
const rows=()=>[...document.querySelectorAll("#items .item")].map(r=>{const i=r.querySelectorAll("input");return{d:i[0].value,q:Math.max(0,+i[1].value||0),p:Math.max(0,+i[2].value||0)}});
function draw(){
 const it=rows(),sub=it.reduce((s,r)=>s+r.q*r.p,0),disc=sub*Math.min(100,Math.max(0,+$("disc").value||0))/100,net=sub-disc,tax=net*Math.min(100,Math.max(0,+$("tax").value||0))/100,tot=net+tax;
 $("sheet").innerHTML=`<div class="sh"><div>${logo?`<img class="logo" src="${logo}" alt="">`:""}<b style="font-size:17px">${esc($("from").value)}</b><div class="pre muted" style="color:var(--mu)">${esc($("fromD").value)}</div></div><div class="meta"><h3>INVOICE</h3><div><b>${esc($("no").value)}</b></div><div>Issued: ${esc($("d1").value)}</div><div>Due: ${esc($("d2").value)}</div></div></div>
 <div class="parties"><div><small>Bill to</small><b>${esc($("to").value||"—")}</b><div class="pre" style="color:var(--mu)">${esc($("toD").value)}</div></div></div>
 <table><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>${it.filter(r=>r.d||r.q*r.p).map(r=>`<tr><td>${esc(r.d)}</td><td>${r.q}</td><td>${fmt(r.p)}</td><td>${fmt(r.q*r.p)}</td></tr>`).join("")||'<tr><td colspan="4" style="text-align:center;color:var(--mu)">Add items to see them here</td></tr>'}</tbody></table>
 <div class="tot"><div><span>Subtotal</span><span>${fmt(sub)}</span></div>${disc?`<div><span>Discount</span><span>−${fmt(disc)}</span></div>`:""}<div><span>Tax (${+$("tax").value||0}%)</span><span>${fmt(tax)}</span></div><div class="gt"><span>Total</span><span>${fmt(tot)}</span></div></div>
 <div class="notes pre">${esc($("notes").value)}</div>`;
 document.title=($("no").value||"Invoice")+" — Invoice Maker";
 try{localStorage.setItem(KEY,JSON.stringify({f:$("from").value,fd:$("fromD").value,t:$("to").value,td:$("toD").value,n:$("no").value,c:$("cur").value,d1:$("d1").value,d2:$("d2").value,tax:$("tax").value,disc:$("disc").value,notes:$("notes").value,it:rows(),logo}))}catch(e){}
}
function init(reset){
 let s=null;if(!reset){try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}}
 $("items").innerHTML="";
 if(s){$("from").value=s.f;$("fromD").value=s.fd;$("to").value=s.t;$("toD").value=s.td;$("no").value=s.n;$("cur").value=s.c;$("d1").value=s.d1;$("d2").value=s.d2;$("tax").value=s.tax;$("disc").value=s.disc;$("notes").value=s.notes;logo=s.logo||"";(s.it.length?s.it:[{d:"",q:1,p:0}]).forEach(r=>addItem(r.d,r.q,r.p))}
 else{$("from").value="Ahmed Sghaier";$("fromD").value="Sousse, Tunisia";$("to").value="";$("toD").value="";$("no").value="INV-"+new Date().getFullYear()+"-001";$("d1").value=today();$("d2").value=plus(14);$("tax").value=19;$("disc").value=0;logo="";addItem("Web development service",1,0)}
 draw();
}
document.querySelector(".panel").addEventListener("input",draw);
$("items").addEventListener("click",e=>{if(e.target.closest("button")){if($("items").children.length>1)e.target.closest(".item").remove();draw()}});
$("add").onclick=()=>{addItem();draw()};
$("print").onclick=()=>window.print();
$("reset").onclick=()=>{if(confirm("Clear this invoice and start over?"))init(true)};
$("logo").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>400000){alert("Please choose an image under 400 KB.");e.target.value="";return}const r=new FileReader();r.onload=()=>{logo=r.result;draw()};r.readAsDataURL(f)};
init(false);
</script></body></html>
